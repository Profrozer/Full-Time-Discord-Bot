<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <title>Architecture and Keep-Alive Workflow</title>
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11131c" />
      <stop offset="100%" stop-color="#0a0c13" />
    </linearGradient>

    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2336" />
      <stop offset="100%" stop-color="#141724" />
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232840" />
      <stop offset="100%" stop-color="#161a2c" />
    </linearGradient>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      @keyframes dashAnim {
        to { stroke-dashoffset: -40; }
      }
      .flow-line {
        stroke-dasharray: 6 6;
        animation: dashAnim 1.8s linear infinite;
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
      }
      .glow-pulse {
        animation: pulseGlow 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="1000" height="320" rx="14" fill="url(#flowBg)" stroke="#222638" stroke-width="1.5" />

  <!-- Background Connecting Trace Lines -->
  <path d="M 215 160 L 375 160" stroke="#5865F2" stroke-width="2" class="flow-line" opacity="0.8" />
  <path d="M 595 125 L 755 105" stroke="#57F287" stroke-width="2" class="flow-line" opacity="0.8" />
  <path d="M 595 195 L 755 215" stroke="#FAA81A" stroke-width="2" class="flow-line" opacity="0.8" />

  <!-- STEP 1: External Monitor (UptimeRobot / Cron) -->
  <g transform="translate(45, 95)" filter="url(#boxShadow)">
    <rect width="170" height="130" rx="10" fill="url(#nodeGrad1)" stroke="#303752" stroke-width="1.2" />
    <circle cx="28" cy="28" r="14" fill="#3BA55D" fill-opacity="0.2" />
    <text x="28" y="33" text-anchor="middle" fill="#57F287" class="mono" font-size="14">🌐</text>
    <text x="50" y="32" fill="#ffffff" class="sans" font-size="14" font-weight="700">HTTP Pinger</text>
    <text x="50" y="47" fill="#8890b5" class="sans" font-size="11">UptimeRobot / Cron</text>

    <line x1="16" y1="62" x2="154" y2="62" stroke="#252b40" stroke-width="1" />
    <text x="16" y="80" fill="#a4adc9" class="mono" font-size="11">→ GET / Every 5m</text>
    <text x="16" y="98" fill="#57F287" class="mono" font-size="11">← 200 "Bot running"</text>
    <text x="16" y="114" fill="#66708f" class="sans" font-size="10">Prevents Dyno Sleep</text>
  </g>

  <!-- STEP 2: The Core Host (Flask + Daemon Thread) -->
  <g transform="translate(375, 55)" filter="url(#boxShadow)">
    <rect width="220" height="210" rx="12" fill="url(#nodeGrad2)" stroke="#5865F2" stroke-width="1.5" />
    <!-- Header banner -->
    <rect width="220" height="34" rx="12" fill="#5865F2" fill-opacity="0.15" />
    <text x="110" y="22" text-anchor="middle" fill="#8ea1ff" class="sans" font-size="12" font-weight="700" letter-spacing="0.5">CORE WORKER INSTANCE</text>

    <!-- Sub-Box A: Flask Web Server -->
    <g transform="translate(14, 46)">
      <rect width="192" height="66" rx="7" fill="#131622" stroke="#2b324d" stroke-width="1" />
      <text x="12" y="22" fill="#ffffff" class="sans" font-size="12" font-weight="700">Thread 1: Flask WSGI</text>
      <text x="12" y="39" fill="#57F287" class="mono" font-size="11">Port :5000 | 0.0.0.0</text>
      <text x="12" y="55" fill="#8890b5" class="sans" font-size="10">Web ping endpoint server</text>
    </g>

    <!-- Sub-Box B: Discord Self-Bot Client -->
    <g transform="translate(14, 124)">
      <rect width="192" height="74" rx="7" fill="#131622" stroke="#2b324d" stroke-width="1" />
      <text x="12" y="22" fill="#ffffff" class="sans" font-size="12" font-weight="700">Thread 2: Nextcord Client</text>
      <text x="12" y="40" fill="#5865F2" class="mono" font-size="11">Asyncio Event Loop</text>
      <text x="12" y="58" fill="#FAA81A" class="mono" font-size="11">Self-Bot Token Auth</text>
    </g>
  </g>

  <!-- STEP 3A: Presence Enforcer Loop -->
  <g transform="translate(755, 45)" filter="url(#boxShadow)">
    <rect width="200" height="105" rx="10" fill="url(#nodeGrad1)" stroke="#303752" stroke-width="1.2" />
    <circle cx="26" cy="26" r="12" fill="#FAA81A" fill-opacity="0.2" />
    <text x="26" y="30" text-anchor="middle" fill="#FAA81A" class="mono" font-size="12">🔄</text>
    <text x="46" y="30" fill="#ffffff" class="sans" font-size="13" font-weight="700">Presence Loop</text>
    <line x1="14" y1="46" x2="186" y2="46" stroke="#252b40" stroke-width="1" />
    <text x="14" y="64" fill="#FAA81A" class="mono" font-size="11">re-enforce: 120s cycle</text>
    <text x="14" y="82" fill="#a4adc9" class="sans" font-size="11">Locks Custom Status</text>
    <text x="14" y="98" fill="#66708f" class="sans" font-size="10">Prevents idle timeouts</text>
  </g>

  <!-- STEP 3B: Discord Gateway & Gateway Stream -->
  <g transform="translate(755, 170)" filter="url(#boxShadow)">
    <rect width="200" height="105" rx="10" fill="url(#nodeGrad1)" stroke="#303752" stroke-width="1.2" />
    <circle cx="26" cy="26" r="12" fill="#5865F2" fill-opacity="0.2" />
    <text x="26" y="30" text-anchor="middle" fill="#5865F2" class="mono" font-size="12">⚡</text>
    <text x="46" y="30" fill="#ffffff" class="sans" font-size="13" font-weight="700">Discord Gateway</text>
    <line x1="14" y1="46" x2="186" y2="46" stroke="#252b40" stroke-width="1" />
    <text x="14" y="64" fill="#57F287" class="mono" font-size="11">Live Uptime Ticker</text>
    <text x="14" y="82" fill="#a4adc9" class="sans" font-size="11">Stdout Console Output</text>
    <text x="14" y="98" fill="#66708f" class="sans" font-size="10">24/7 Green Status</text>
  </g>
</svg>
