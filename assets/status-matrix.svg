<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="100%" height="100%">
  <title>Discord Status Matrix</title>
  <defs>
    <linearGradient id="matrixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12141e" />
      <stop offset="100%" stop-color="#0b0d14" />
    </linearGradient>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="1000" height="180" rx="12" fill="url(#matrixBg)" stroke="#202436" stroke-width="1.5" />

  <!-- Grid of 4 Presence Types -->

  <!-- Card 1: Online -->
  <g transform="translate(25, 25)">
    <rect width="215" height="130" rx="9" fill="#171926" stroke="#262b40" stroke-width="1" />
    <!-- Status Icon -->
    <circle cx="28" cy="28" r="9" fill="#57F287" />
    <text x="46" y="33" fill="#ffffff" class="sans" font-size="15" font-weight="700">Online</text>
    <rect x="135" y="19" width="65" height="18" rx="4" fill="#57F287" fill-opacity="0.15" />
    <text x="142" y="32" fill="#57F287" class="mono" font-size="10" font-weight="700">READY</text>

    <line x1="14" y1="52" x2="201" y2="52" stroke="#252a3d" stroke-width="1" />
    <text x="14" y="74" fill="#a4adc9" class="mono" font-size="11">discord.Status.online</text>
    <text x="14" y="96" fill="#8890b5" class="sans" font-size="11">Standard active presence</text>
    <text x="14" y="114" fill="#555d7e" class="sans" font-size="10">Shows bright green dot</text>
  </g>

  <!-- Card 2: Idle (Default in main.py) -->
  <g transform="translate(265, 25)">
    <rect width="225" height="130" rx="9" fill="#171926" stroke="#FAA81A" stroke-width="1.4" />
    <!-- Status Icon: Moon -->
    <circle cx="28" cy="28" r="9" fill="#FAA81A" />
    <circle cx="25" cy="25" r="7" fill="#171926" />
    <text x="46" y="33" fill="#ffffff" class="sans" font-size="15" font-weight="700">Idle</text>
    <rect x="90" y="19" width="118" height="18" rx="4" fill="#FAA81A" fill-opacity="0.2" />
    <text x="96" y="32" fill="#FAA81A" class="mono" font-size="10" font-weight="700">★ REPO DEFAULT</text>

    <line x1="14" y1="52" x2="211" y2="52" stroke="#252a3d" stroke-width="1" />
    <text x="14" y="74" fill="#FAA81A" class="mono" font-size="11">discord.Status.idle</text>
    <text x="14" y="96" fill="#a4adc9" class="sans" font-size="11">Subtle away badge</text>
    <text x="14" y="114" fill="#555d7e" class="sans" font-size="10">Simulates AFK coding</text>
  </g>

  <!-- Card 3: Do Not Disturb -->
  <g transform="translate(515, 25)">
    <rect width="215" height="130" rx="9" fill="#171926" stroke="#262b40" stroke-width="1" />
    <!-- Status Icon: Red Minus -->
    <circle cx="28" cy="28" r="9" fill="#ED4245" />
    <rect x="23" y="26.5" width="10" height="3" rx="1.5" fill="#171926" />
    <text x="46" y="33" fill="#ffffff" class="sans" font-size="15" font-weight="700">DND</text>
    <rect x="135" y="19" width="65" height="18" rx="4" fill="#ED4245" fill-opacity="0.15" />
    <text x="142" y="32" fill="#ED4245" class="mono" font-size="10" font-weight="700">MUTED</text>

    <line x1="14" y1="52" x2="201" y2="52" stroke="#252a3d" stroke-width="1" />
    <text x="14" y="74" fill="#a4adc9" class="mono" font-size="11">discord.Status.dnd</text>
    <text x="14" y="96" fill="#8890b5" class="sans" font-size="11">Do Not Disturb badge</text>
    <text x="14" y="114" fill="#555d7e" class="sans" font-size="10">Blocks client sound pings</text>
  </g>

  <!-- Card 4: Invisible -->
  <g transform="translate(755, 25)">
    <rect width="215" height="130" rx="9" fill="#171926" stroke="#262b40" stroke-width="1" />
    <!-- Status Icon: Gray Ring -->
    <circle cx="28" cy="28" r="9" fill="#747F8D" />
    <circle cx="28" cy="28" r="5" fill="#171926" />
    <text x="46" y="33" fill="#ffffff" class="sans" font-size="15" font-weight="700">Invisible</text>
    <rect x="135" y="19" width="65" height="18" rx="4" fill="#747F8D" fill-opacity="0.15" />
    <text x="142" y="32" fill="#9da5b3" class="mono" font-size="10" font-weight="700">GHOST</text>

    <line x1="14" y1="52" x2="201" y2="52" stroke="#252a3d" stroke-width="1" />
    <text x="14" y="74" fill="#a4adc9" class="mono" font-size="11">discord.Status.invisible</text>
    <text x="14" y="96" fill="#8890b5" class="sans" font-size="11">Appears offline to all</text>
    <text x="14" y="114" fill="#555d7e" class="sans" font-size="10">Stealth background run</text>
  </g>
</svg>
